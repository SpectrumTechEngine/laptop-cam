<html lang="en">

<style>
:root{--bg:#0d1b2a;--card:#162a40;--line:#25415f;--text:#eef4fb;--dim:#9db2c8;--accent:#4cc3ff;--live:#ff4757;--ok:#2ed573}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;background:var(--accent);color:#04121f;font-weight:700}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.danger{background:transparent;color:#ff8a95;border:1px solid #5a2a35}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:44px;height:44px;border-radius:12px}
header h1{font-size:22px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.big{display:block;width:100%;text-align:left;padding:20px;margin-bottom:12px;font-size:18px}
.big small{display:block;font-weight:400;opacity:.8;font-size:14px;margin-top:4px}
.dim{color:var(--dim)}
.status{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.live{background:var(--live);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
#preview{width:100%;border-radius:12px;background:#000;margin-top:14px;display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}
input{display:block;width:100%;font:inherit;font-size:17px;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:#0a1522;color:var(--text)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.err{color:#ff8a95;min-height:1em;margin:0 0 10px;font-size:15px}
.topic{font:700 22px/1.3 ui-monospace,Consolas,monospace;background:#0a1522;padding:12px;border-radius:10px;text-align:center;letter-spacing:1px;margin:6px 0;user-select:all}
button:disabled{opacity:.6}
ul{padding-left:20px;margin:8px 0}li{margin:4px 0}
/* viewer */
#viewer{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#viewer video,#viewer img{width:100%;height:100%;object-fit:contain;display:block}
#viewer img{position:absolute;inset:0;display:none}
.bar{position:absolute;left:0;right:0;display:flex;gap:10px;align-items:center;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.top{top:0;background:linear-gradient(#000a,#0000)}
.bottom{bottom:0;top:auto;justify-content:center;padding-bottom:max(16px,env(safe-area-inset-bottom));background:linear-gradient(#0000,#000a)}
.pill{background:#0009;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.bottom button{background:#000a;color:#fff;border:1px solid #fff3;padding:12px 16px}
#msg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;font-size:18px;color:#dde}
#msg small{display:block;color:var(--dim);font-size:14px;margin-top:6px}
.spin{width:34px;height:34px;border:4px solid #fff3;border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
<div id="app"></div>
<script src="https://thespectrumtechengine.com/ste-owner.js" data-app="laptop-cam" defer></script>
<script type="module">
// Laptop Cam: the laptop is the camera, the phone watches.
// The two connect directly (WebRTC). They find each other through a "room" in Chop the Check's
// Realtime Database (rooms/laptop-cam-<id>), the same place the online games use.
// Everything written there is locked (AES-GCM) with a secret key that only lives on the laptop
// and the phones it was linked to (it travels inside the QR code), so nobody else can watch.

const CFG = {
  apiKey: 'AIzaSyCFKyTr_-0QC7Vl-HjUpfMibi5Eu4IgKz0',
  authDomain: 'chopthecheck.firebaseapp.com',
  databaseURL: 'https://chopthecheck-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'chopthecheck',
  appId: '1:506847790153:web:109788afc2ad8afc31eb98',
};
const RECAPTCHA = '6LeJiNAtAAAAAHozjgInBddSFOPOPBOMRsPwQ6qH';
const FB = 'https://www.gstatic.com/firebasejs/12.19.0/';
const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }, { urls: 'stun:stun.cloudflare.com:3478' }];
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const FAKE = LOCAL && new URLSearchParams(location.search).has('fake');   // test camera for local testing

const app = document.getElementById('app');
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- secret key + locking ----------
function toB64u(buf) {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const fromB64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
let KEY = null, ROOM = '';
async function useKey(k) {
  KEY = await crypto.subtle.importKey('raw', fromB64u(k).slice(0, 16), 'AES-GCM', false, ['encrypt', 'decrypt']);
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('laptop-cam|' + k)));
  ROOM = [...h.slice(0, 12)].map((x) => x.toString(16).padStart(2, '0')).join('');
}
async function lock(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, KEY, new TextEncoder().encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return toB64u(out);
}
async function unlock(s) {
  try {
    const b = fromB64u(s);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, KEY, b.slice(12))));
  } catch { return null; }
}

// ---------- the room ----------
let fbP = null, clock = 0;
const now = () => Date.now() + clock;                 // the server's clock
const FRESH = 150000;                                 // a device that hasn't checked in for 2½ minutes is gone
                                                      // (Chrome slows timers in hidden tabs to once a minute)
function base() {
  if (!fbP) fbP = (async () => {
    const [appM, dbM] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-database.js')]);
    const a = appM.initializeApp(CFG, 'laptop-cam');
    if (/thespectrumtechengine\.com$/.test(location.hostname)) {
      try { const ac = await import(FB + 'firebase-app-check.js'); ac.initializeAppCheck(a, { provider: new ac.ReCaptchaEnterpriseProvider(RECAPTCHA), isTokenAutoRefreshEnabled: true }); } catch {}
    }
    const db = dbM.getDatabase(a);
    dbM.onValue(dbM.ref(db, '.info/serverTimeOffset'), (s) => { clock = Number(s.val()) || 0; });
    return { dbM, db };
  })().catch((e) => { fbP = null; throw e; });
  return fbP;
}
// Joins the room. onPeers(list) gets everyone else; onLink(true/false) says if we're connected.
async function joinRoom(onPeers, onLink) {
  const { dbM, db } = await base();
  const me = rid();
  const peersRef = dbM.ref(db, 'rooms/laptop-cam-' + ROOM + '/peers'), mine = dbM.child(peersRef, me);
  let p = {}, left = false, online = false, all = [];
  const write = () => (left || !online) ? Promise.resolve() : dbM.set(mine, { p: JSON.parse(JSON.stringify(p)), t: dbM.serverTimestamp() }).catch((e) => console.warn('write', e));
  // Only devices that checked in recently count. Very old leftovers get cleared away.
  const tell = () => {
    const n = now();
    all.filter((x) => n - x.t > 3 * FRESH).forEach((x) => dbM.remove(dbM.child(peersRef, x.id)).catch(() => {}));
    onPeers(all.filter((x) => n - x.t <= FRESH));
  };
  const offPeers = dbM.onValue(peersRef, (s) => {
    if (left) return;
    all = Object.entries(s.val() || {}).filter(([id]) => id !== me).map(([id, d]) => ({ id, p: (d && d.p) || {}, t: Number(d && d.t) || 0 }));
    tell();
  }, (e) => console.warn('read', e));
  const beat = setInterval(() => { write(); tell(); }, 20000);   // check in every 20 seconds
  const offConn = dbM.onValue(dbM.ref(db, '.info/connected'), async (s) => {
    online = s.val() === true;
    if (online && !left) { try { await dbM.onDisconnect(mine).remove(); } catch {} await write(); }
    onLink && onLink(online);
  });
  return {
    me,
    set(o) { Object.assign(p, o); for (const k in p) if (p[k] == null) delete p[k]; return write(); },
    async leave() { left = true; clearInterval(beat); offPeers(); offConn(); try { await dbM.onDisconnect(mine).cancel(); } catch {} try { await dbM.remove(mine); } catch {} },
  };
}
const iceDone = (pc) => new Promise((r) => {
  if (pc.iceGatheringState === 'complete') return r();
  const t = setTimeout(r, 4000);
  pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } });
});

// The password is turned into the secret key (slowly, so guessing passwords takes ages).
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode('laptop-cam/v1'), iterations: 310000 }, base, 256);
  return toB64u(bits);
}
const PHONE = /Android|iPhone|iPad/.test(navigator.userAgent);
const device = () => /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android phone' : 'computer';

// ---------- start ----------
function boot() {
  if (store.get('lc_role') === 'cam') return cameraScreen();
  homeScreen();
}

function homeScreen(err) {
  if (store.get('lc_okey')) return ownerScreen(err);       // the owner's own phone
  app.innerHTML = `<div class="wrap">
    <header><img src="icon-192.png" alt=""><h1>Laptop Cam</h1></header>
    <form class="card" id="fView">
      <b style="font-size:19px">📺 Live view</b>
      <p class="dim" style="margin:6px 0 12px">Enter the password to watch.</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <input id="nm" type="text" maxlength="24" placeholder="Your name (optional)" autocomplete="nickname">
      <div class="err" id="err">${err ? esc(err) : ''}</div>
      <button id="bGo" style="width:100%">Watch live</button>
      <p class="dim" style="font-size:13px;margin:10px 0 0">The owner gets a notification when someone watches.</p>
    </form>
    <div class="row"><button class="ghost" id="bMine">📱 This is my phone</button><button class="ghost" id="bCam">💻 Be the camera</button></div>
  </div>`;
  const $ = (id) => document.getElementById(id);
  $('nm').value = store.get('lc_name') || '';
  $('fView').onsubmit = async (e) => {
    e.preventDefault();
    $('bGo').disabled = true; $('bGo').textContent = 'Checking…';
    const name = $('nm').value.trim().slice(0, 24); store.set('lc_name', name);
    viewerScreen(await keyFromPassword($('pw').value.trim()), name);
  };
  $('bCam').onclick = () => { store.set('lc_role', 'cam'); cameraScreen(); };
  $('bMine').onclick = () => myPhoneSetup();
}

// Laptop: choose (or change) the password.
function passwordScreen(changing) {
  app.innerHTML = `<div class="wrap">
    <header><img src="icon-192.png" alt=""><h1>Laptop Cam</h1></header>
    <form class="card" id="fPw">
      <b style="font-size:19px">${changing ? 'Change the password' : 'Choose a password'}</b>
      <p class="dim" style="margin:6px 0 12px">Anyone who knows it can watch this camera. Use at least 8 letters/numbers, not something easy to guess.${changing ? ' Phones using the old password will stop working.' : ''}</p>
      <input id="p1" type="password" autocomplete="new-password" placeholder="Password" required minlength="8">
      <input id="p2" type="password" autocomplete="new-password" placeholder="Type it again" required>
      <div class="err" id="err"></div>
      <button id="bSave" style="width:100%">Save password</button>
    </form>
    <button class="ghost" id="bBack" style="width:100%">‹ Back</button>
  </div>`;
  const $ = (id) => document.getElementById(id);
  $('fPw').onsubmit = async (e) => {
    e.preventDefault();
    const a = $('p1').value.trim(), b = $('p2').value.trim();
    if (a.length < 8) return void ($('err').textContent = 'Use at least 8 characters.');
    if (a !== b) return void ($('err').textContent = 'The two passwords are different.');
    $('bSave').disabled = true; $('bSave').textContent = 'Saving…';
    store.set('lc_key', await keyFromPassword(a));
    location.reload();
  };
  $('bBack').onclick = () => { if (changing) location.reload(); else { store.del('lc_role'); homeScreen(); } };
}

// Phone alerts: our own small server (Cloud Function "laptopCam" in chopthecheck) sends the notifications.
const FN = 'https://europe-west1-chopthecheck.cloudfunctions.net/laptopCam';
async function callFn(o) {
  try { const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) }); return { status: r.status, ...(await r.json().catch(() => ({}))) }; }
  catch { return { status: 0 }; }
}
// Inside the Android app (APK) we use Android's own notifications; in a browser, web notifications.
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const PN = () => NATIVE && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
const pushOK = () => PN() || ('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window);
async function nativeToken() {
  const pn = PN();
  let perm = await pn.checkPermissions();
  if (perm.receive !== 'granted') perm = await pn.requestPermissions();
  if (perm.receive !== 'granted') throw new Error('blocked');
  try { await pn.createChannel({ id: 'watch', name: 'Someone is watching', description: 'When someone starts watching your laptop camera', importance: 5, visibility: 1, vibration: true }); } catch {}
  await pn.removeAllListeners();
  return new Promise((ok, bad) => {
    const t = setTimeout(() => bad(new Error('timed out')), 20000);
    pn.addListener('registration', (r) => { clearTimeout(t); ok(r.value); });
    pn.addListener('registrationError', (e) => { clearTimeout(t); bad(new Error(e && e.error || 'registration failed')); });
    pn.register();
  });
}

// Is the camera with the current password online right now?
async function camOnline() {
  try {
    const { dbM, db } = await base();
    const v = (await dbM.get(dbM.ref(db, 'rooms/laptop-cam-' + ROOM + '/peers'))).val() || {};
    return Object.values(v).some((d) => d && d.p && d.p.r === 'cam' && now() - (Number(d.t) || 0) < FRESH);
  } catch { return false; }
}

// Sign this phone up for alerts (uses the key already in use). Throws an Error with a plain message.
async function turnOnAlerts() {
  if (!pushOK()) throw new Error('This browser can\'t get alerts. Use the Laptop Cam app, or Chrome.');
  if (PN()) {
    let token;
    try { token = await nativeToken(); }
    catch (x) { throw new Error(x && x.message === 'blocked' ? 'Notifications are off for Laptop Cam. Turn them on in Settings → Apps → Laptop Cam → Notifications, then try again.' : 'Could not turn on alerts: ' + (x && x.message)); }
    const r = await callFn({ op: 'sub', room: ROOM, fcm: token });
    if (!r.id) throw new Error('Could not turn on alerts' + (r.status === 429 ? ': too many phones already.' : '. Check the internet.'));
    store.set('lc_push_id', r.id); store.set('lc_push_room', ROOM);
    return;
  }
  if (await Notification.requestPermission() !== 'granted') throw new Error('Notifications are blocked. Allow them for this site in the browser\'s settings, then try again.');
  const kr = await callFn({ op: 'key' }); if (!kr.key) throw new Error('Could not reach the alert server. Check the internet.');
  const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  const old = await reg.pushManager.getSubscription(); if (old) await old.unsubscribe();
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: fromB64u(kr.key) });
  const r = await callFn({ op: 'sub', room: ROOM, sub: sub.toJSON() });
  if (!r.id) throw new Error('Could not turn on alerts' + (r.status === 429 ? ': too many phones already.' : '.'));
  store.set('lc_push_id', r.id); store.set('lc_push_room', ROOM);
}
async function turnOffAlerts() {
  const id = store.get('lc_push_id'), room = store.get('lc_push_room');
  try {
    if (PN()) await PN().unregister();
    else { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); }
  } catch {}
  if (id) await callFn({ op: 'unsub', room, id });
  store.del('lc_push_id'); store.del('lc_push_room');
}

// "This is my phone": enter the password once; the phone remembers it and gets the alerts.
function myPhoneSetup(err) {
  app.innerHTML = `<div class="wrap">
    <header><img src="icon-192.png" alt=""><h1>Laptop Cam</h1></header>
    <form class="card" id="fMine">
      <b style="font-size:19px">📱 This is my phone</b>
      <p class="dim" style="margin:6px 0 12px">Enter the camera password once. This phone will remember it, so you can watch with one tap, and it gets a notification whenever <b>someone else</b> starts watching.</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Camera password" required>
      <div class="err" id="err">${err ? esc(err) : ''}</div>
      <button id="bSave" style="width:100%">Save</button>
      <p class="dim" style="font-size:13px;margin:10px 0 0">Only do this on your own phone.</p>
    </form>
    <button class="ghost" id="bBack" style="width:100%">‹ Back</button>
  </div>`;
  const $ = (id) => document.getElementById(id);
  $('bBack').onclick = () => homeScreen();
  $('fMine').onsubmit = async (e) => {
    e.preventDefault();
    $('bSave').disabled = true; $('bSave').textContent = 'Checking…';
    const k = await keyFromPassword($('pw').value.trim()); await useKey(k);
    if (!await camOnline() && !confirm('No camera is online with that password right now.\n\nIf the laptop is just switched off, tap OK to save it anyway. If you might have typed it wrong, tap Cancel.')) {
      $('bSave').disabled = false; $('bSave').textContent = 'Save'; return;
    }
    store.set('lc_okey', k); store.set('lc_name', 'Me');
    let note = 'Saved ✓ Alerts are on.';
    $('bSave').textContent = 'Turning on alerts…';
    try { await turnOnAlerts(); } catch (x) { note = 'Saved ✓ But alerts are not on yet: ' + x.message; }
    ownerScreen(null, note);
  };
}

// The owner's phone: one-tap watch, camera status, alerts.
async function ownerScreen(err, note) {
  await useKey(store.get('lc_okey'));
  const alertsOn = store.get('lc_push_id') && store.get('lc_push_room') === ROOM;
  app.innerHTML = `<div class="wrap">
    <header><img src="icon-192.png" alt=""><h1>Laptop Cam</h1></header>
    <div class="card">
      <div class="status"><span class="dot" id="dot"></span><span id="st">Checking the camera…</span></div>
      <div class="err" id="err" style="margin:10px 0 0">${err ? esc(err) : ''}</div>
      <button id="bWatch" style="width:100%;margin-top:12px;font-size:19px">📺 Watch live</button>
    </div>
    <div class="card"><b>${alertsOn ? '🔔 Alerts are on' : '🔕 Alerts are off'}</b>
      <p class="dim" style="margin:6px 0 12px">${alertsOn ? 'This phone gets a notification when someone else starts watching. (Not when you watch.)' : 'Turn on to get a notification when someone else starts watching.'}</p>
      <div class="err" id="note" style="color:${note && /not on yet/.test(note) ? '#ff8a95' : 'var(--ok)'}">${note ? esc(note) : ''}</div>
      <div class="row">${alertsOn ? '<button id="bTest">Send a test alert</button><button class="ghost" id="bOff">Turn off</button>' : '<button id="bOn">Turn on alerts</button>'}</div>
    </div>
    <div class="row"><button class="ghost" id="bPw">🔑 New password</button><button class="danger" id="bForget">Not my phone</button></div>
  </div>`;
  const $ = (id) => document.getElementById(id);
  camOnline().then((on) => { if (!$('st')) return; $('dot').className = 'dot ' + (on ? 'ok' : ''); $('st').textContent = on ? 'Camera is online' : 'Camera is offline'; });
  $('bWatch').onclick = () => viewerScreen(store.get('lc_okey'), 'Me');
  if (alertsOn) {
    $('bTest').onclick = async () => {
      $('bTest').textContent = 'Sending…';
      const r = await callFn({ op: 'send', room: ROOM, title: '👁 Laptop Cam test', body: 'Alerts are working on this phone.' });
      $('bTest').textContent = r.status === 200 && r.sent ? 'Sent ✓' : r.status === 429 ? 'Wait a few seconds' : 'Could not send';
    };
    $('bOff').onclick = async () => { await turnOffAlerts(); ownerScreen(); };
  } else {
    $('bOn').onclick = async () => {
      $('bOn').disabled = true; $('bOn').textContent = 'Turning on…';
      try { await turnOnAlerts(); ownerScreen(null, 'Alerts are on ✓'); }
      catch (x) { $('note').style.color = '#ff8a95'; $('note').textContent = x.message; $('bOn').disabled = false; $('bOn').textContent = 'Turn on alerts'; }
    };
  }
  $('bPw').onclick = async () => { await turnOffAlerts(); store.del('lc_okey'); myPhoneSetup(); };
  $('bForget').onclick = async () => {
    if (!confirm('Forget the password on this phone and stop its alerts?')) return;
    await turnOffAlerts(); store.del('lc_okey'); store.del('lc_name'); homeScreen();
  };
}

// ---------- the laptop (camera) ----------
async function cameraScreen() {
  const k = store.get('lc_key');
  if (!k) return passwordScreen(false);
  await useKey(k);
  app.innerHTML = `<div class="wrap">
    <header><img src="icon-192.png" alt=""><h1>Laptop Cam</h1></header>
    <div class="card"><div class="status"><span class="dot" id="dot"></span><span id="st">Starting…</span></div>
      <div class="dim" id="sub" style="margin-top:6px"></div>
      <video id="preview" muted playsinline autoplay></video></div>
    <div class="card" id="camPick" hidden><b>Which camera</b>
      <div class="row" style="margin-top:10px"><button class="ghost" id="bFront">🤳 Front</button><button class="ghost" id="bBack">📷 Back</button></div></div>
    <div class="card" id="alertBox"></div>
    <div class="card" id="who" hidden><b>Who watched</b><ul class="dim" id="whoList"></ul></div>
    <div class="card"><b>To keep it working</b><ul class="dim">${PHONE ? `
      <li>Keep this app open on the screen and the phone plugged in.</li>
      <li>Prop the phone up where you want it pointing.</li>` : `
      <li>Leave this page open (you can put other windows on top).</li>
      <li>Keep the laptop plugged in with the lid open.</li>
      <li>Windows Settings → System → Power &amp; battery → set sleep "when plugged in" to <b>Never</b>.</li>`}
      <li>The camera light only comes on while someone is watching.</li></ul></div>
    <div class="row"><button class="ghost" id="bPw">🔑 Change password</button><button class="ghost" id="bStop">Stop being the camera</button></div>
  </div>`;
  const $ = (id) => document.getElementById(id);
  const preview = $('preview');
  let room = null, online = false, stream = null, stopTimer = 0, snapTimer = 0, wake = null, viewers = [];
  const pcs = new Map();          // viewer id -> { pc, oid }
  const answers = {};             // viewer id -> { oid, s }
  const busy = new Set();

  const keepAwake = async () => { try { if (document.visibilityState === 'visible' && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch {} };
  document.addEventListener('visibilitychange', keepAwake); keepAwake();

  function show() {
    const n = viewers.length, live = [...pcs.values()].filter((c) => c.pc.connectionState === 'connected').length;
    $('dot').className = 'dot ' + (!online ? '' : n ? 'live' : 'ok');
    $('st').textContent = !online ? 'Offline: waiting for the internet…' : n ? `Live: ${n} phone${n > 1 ? 's' : ''} watching` : 'Ready. Nobody is watching.';
    $('sub').textContent = !online ? 'It will reconnect by itself.' : n ? (live ? '' : 'Connecting…') : 'Open Laptop Cam on your phone, tap Live view and enter the password.';
    preview.style.display = stream ? 'block' : 'none';
  }

  async function getStream() {
    clearTimeout(stopTimer);
    if (stream) return stream;
    if (FAKE) stream = fakeStream();
    else {
      try { stream = await navigator.mediaDevices.getUserMedia({ video: videoWanted(), audio: { echoCancellation: true, noiseSuppression: true } }); }
      catch { stream = await navigator.mediaDevices.getUserMedia({ video: videoWanted() }); }
    }
    preview.srcObject = stream; show();
    return stream;
  }

  // Front or back camera (only offered when the device has more than one camera).
  let facing = store.get('lc_facing') || (PHONE ? 'environment' : 'user');
  const videoWanted = () => ({ facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } });
  const showFacing = () => { $('bFront').className = facing === 'user' ? '' : 'ghost'; $('bBack').className = facing === 'environment' ? '' : 'ghost'; };
  async function useFacing(f) {
    if (f === facing) return;
    facing = f; store.set('lc_facing', f); showFacing();
    preview.style.transform = '';
    if (!stream || FAKE) return;
    // Swap the picture without dropping anyone who is watching
    try {
      const nv = (await navigator.mediaDevices.getUserMedia({ video: videoWanted() })).getVideoTracks()[0];
      const old = stream.getVideoTracks()[0];
      for (const c of pcs.values()) for (const s of c.pc.getSenders()) if (s.track && s.track.kind === 'video') await s.replaceTrack(nv);
      if (old) { stream.removeTrack(old); old.stop(); }
      stream.addTrack(nv); preview.srcObject = stream;
    } catch (e) { console.warn('switch camera', e); $('sub').textContent = 'Could not switch camera.'; }
  }
  $('bFront').onclick = () => useFacing('user');
  $('bBack').onclick = () => useFacing('environment');
  showFacing();
  try { if ((await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput').length > 1 || PHONE) $('camPick').hidden = false; } catch {}
  function maybeStop() {
    clearTimeout(stopTimer);
    if (viewers.length) return;
    stopTimer = setTimeout(() => {
      if (viewers.length || !stream) return;
      stream.getTracks().forEach((t) => t.stop()); stream = null; preview.srcObject = null; show();
    }, 4000);
  }

  async function answer(v) {
    const key = v.id + '|' + v.p.oid;
    if (busy.has(key)) return; busy.add(key);
    const offer = await unlock(v.p.o); if (!offer) return;
    const old = pcs.get(v.id); if (old) old.pc.close();
    const pc = new RTCPeerConnection({ iceServers: ICE });
    pcs.set(v.id, { pc, oid: v.p.oid });
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') { pc.close(); if (pcs.get(v.id)?.pc === pc) pcs.delete(v.id); } show(); };
    try {
      await pc.setRemoteDescription(offer);
      const s = await getStream();
      s.getTracks().forEach((t) => pc.addTrack(t, s));
      await pc.setLocalDescription(await pc.createAnswer());
      await iceDone(pc);
      if (pcs.get(v.id)?.pc !== pc) return;
      answers[v.id] = { oid: v.p.oid, s: await lock(pc.localDescription.toJSON()) };
      await room.set({ a: { ...answers } });
    } catch (e) {
      console.warn('answer', e);
      $('sub').textContent = /Permission|NotAllowed/i.test(e && e.name) ? 'The camera is blocked. Click the camera icon in the address bar and choose Allow.' : 'Could not start the camera: ' + (e && e.message);
    }
  }

  // Still pictures, for when a direct video link can't be made (some mobile networks).
  async function snapLoop() {
    clearTimeout(snapTimer);
    if (!viewers.some((v) => v.p.snap)) { room.set({ i: null }); return; }
    try {
      const s = await getStream();
      const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.srcObject = s; await v.play();
      const w = 640, h = Math.round(w * (v.videoHeight || 360) / (v.videoWidth || 640));
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h); v.srcObject = null;
      await room.set({ i: await lock({ d: c.toDataURL('image/jpeg', 0.55), t: Date.now() }) });
    } catch (e) { console.warn('snap', e); }
    snapTimer = setTimeout(snapLoop, 1500);
  }

  function onPeers(list) {
    viewers = list.filter((x) => x.p.r === 'view');
    const ids = new Set(viewers.map((v) => v.id));
    let changed = false;
    for (const [id, c] of pcs) if (!ids.has(id)) { c.pc.close(); pcs.delete(id); }
    for (const id in answers) if (!ids.has(id)) { delete answers[id]; changed = true; }
    if (changed) room.set({ a: { ...answers } });
    for (const v of viewers) if (v.p.o && v.p.oid && pcs.get(v.id)?.oid !== v.p.oid) answer(v);
    if (viewers.some((v) => v.p.snap) && !snapTimer) snapLoop();
    if (!viewers.some((v) => v.p.snap) && snapTimer) { clearTimeout(snapTimer); snapTimer = 0; room.set({ i: null }); }
    maybeStop(); show();
    for (const v of viewers) if (v.p.w && !told.has(v.p.w)) { told.add(v.p.w); store.set('lc_told', JSON.stringify([...told].slice(-50))); tellOwner(v); }
  }

  // Someone started watching: list it here and send the phone alert.
  const told = new Set(JSON.parse(store.get('lc_told') || '[]'));
  async function tellOwner(v) {
    const who = (v.p.who && await unlock(v.p.who)) || {};
    const when = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const line = `${who.n ? who.n : 'Someone'} (${who.d || 'unknown device'}) at ${when}`;
    $('who').hidden = false;
    const li = document.createElement('li'); li.textContent = line; $('whoList').prepend(li);
    callFn({ op: 'send', room: ROOM, skip: who.pid || '', title: '👁 Laptop Cam is being watched', body: `${who.n ? who.n + ' started' : 'Someone started'} watching on ${who.d === 'computer' ? 'a computer' : who.d ? 'an ' + who.d : 'a device'} at ${when}.` });
  }

  $('alertBox').innerHTML = `<b>🔔 Phone alerts</b>
    <p class="dim" style="margin:6px 0 12px">To get a notification when someone starts watching: open Laptop Cam on your phone, tap <b>🔔 Alerts</b>, and enter this camera's password.</p>
    <button class="ghost" id="bTest" style="width:100%">Send a test alert to my phones</button>`;
  $('bTest').onclick = async () => {
    $('bTest').textContent = 'Sending…';
    const r = await callFn({ op: 'send', room: ROOM, title: '👁 Laptop Cam test', body: 'Alerts from your laptop are working.' });
    $('bTest').textContent = r.status !== 200 ? (r.status === 429 ? 'Wait a few seconds and try again' : 'Could not reach the alert server') : r.phones ? `Sent to ${r.sent} phone${r.sent === 1 ? '' : 's'} ✓` : 'No phones have alerts turned on yet';
  };

  try {
    room = await joinRoom(onPeers, (on) => { online = on; show(); });
    await room.set({ r: 'cam' });
  } catch (e) { $('st').textContent = 'Could not reach the server.'; $('sub').textContent = 'Check the internet, then reload this page.'; return; }
  show();
  window.addEventListener('pagehide', () => room && room.leave());

  const quit = async () => { await room.leave(); stream && stream.getTracks().forEach((t) => t.stop()); };
  $('bStop').onclick = async () => { if (!confirm('Stop using this laptop as the camera?')) return; await quit(); store.del('lc_role'); location.reload(); };
  $('bPw').onclick = async () => { await quit(); passwordScreen(true); };
}

// A pretend camera for local testing (?fake): a moving clock and a beep.
function fakeStream() {
  const c = document.createElement('canvas'); c.width = 640; c.height = 360; const g = c.getContext('2d');
  (function draw() { const t = Date.now() / 1000; g.fillStyle = '#123'; g.fillRect(0, 0, 640, 360); g.fillStyle = '#4cc3ff'; g.beginPath(); g.arc(320 + 200 * Math.sin(t), 180, 40, 0, 7); g.fill(); g.fillStyle = '#fff'; g.font = '32px sans-serif'; g.fillText(new Date().toLocaleTimeString(), 20, 50); setTimeout(draw, 66); })();
  const s = c.captureStream(15);
  try { const ac = new AudioContext(), o = ac.createOscillator(), d = ac.createMediaStreamDestination(); o.frequency.value = 330; o.connect(d); o.start(); d.stream.getAudioTracks().forEach((t) => s.addTrack(t)); } catch {}
  return s;
}

// ---------- the phone (viewer) ----------
async function viewerScreen(k, name) {
  await useKey(k);
  const watch = rid();               // one alert per visit, even if the phone screen goes off and on
  let everSeen = false, dead = false;
  app.innerHTML = `<div id="viewer">
    <video id="vid" playsinline autoplay muted></video><img id="still" alt="">
    <div id="msg"><div class="spin"></div>Connecting to your laptop…</div>
    <div class="bar top"><span class="pill" id="pill"><span class="dot" id="dot"></span><span id="pt">Connecting</span></span></div>
    <div class="bar bottom"><button id="bSound">🔇 Sound off</button><button id="bFull">⛶ Full screen</button><button id="bMore">✕ Stop</button></div>
  </div>`;
  const $ = (id) => document.getElementById(id);
  const vid = $('vid'), still = $('still');
  let room = null, pc = null, oid = '', camId = '', answered = false, tries = 0, snap = false, timer = 0, gen = 0, lastImg = '';

  const say = (html, spin) => { $('msg').innerHTML = html ? (spin ? '<div class="spin"></div>' : '') + html : ''; };
  const pill = (txt, cls) => { $('pt').textContent = txt; $('dot').className = 'dot ' + (cls || ''); };

  async function offer() {
    clearTimeout(timer);
    if (pc) pc.close();
    answered = false;
    const my = pc = new RTCPeerConnection({ iceServers: ICE });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    const ms = new MediaStream();
    pc.ontrack = (e) => { ms.addTrack(e.track); vid.srcObject = ms; vid.play().catch(() => {}); };
    pc.onconnectionstatechange = () => {
      if (pc !== my) return;
      const s = my.connectionState;
      if (s === 'connected') { tries = 0; snap = false; room.set({ snap: null }); clearTimeout(timer); still.style.display = 'none'; vid.style.display = 'block'; say(''); pill('LIVE', 'live'); }
      if (s === 'failed') retry();
      if (s === 'disconnected') { pill('Reconnecting', ''); clearTimeout(timer); timer = setTimeout(() => { if (my.connectionState !== 'connected') retry(); }, 6000); }
    };
    await pc.setLocalDescription(await pc.createOffer());
    await iceDone(pc);
    if (pc !== my) return;
    oid = rid();
    await room.set({ o: await lock(pc.localDescription.toJSON()), oid });
    timer = setTimeout(() => { if (my.connectionState !== 'connected') retry(); }, 20000);
  }
  function retry() {
    tries++;
    if (tries >= 2 && !snap) { snap = true; room.set({ snap: 1 }); pill('Still pictures', 'ok'); say('Live video can\'t get through on this network, so you\'ll see a new picture every couple of seconds.<small>It will keep trying for live video.</small>', true); }
    clearTimeout(timer); timer = setTimeout(offer, snap ? 30000 : 1000);
  }

  async function onPeers(list) {
    const cams = list.filter((x) => x.p.r === 'cam').sort((a, b) => b.t - a.t);
    const cam = cams[0];
    if (cam) everSeen = true;
    if (!cam) {
      camId = ''; clearTimeout(timer); if (pc) { pc.close(); pc = null; }
      vid.srcObject = null; still.style.display = 'none';
      pill('Laptop offline', ''); say('Your laptop isn\'t online right now.<small>Check the laptop is on, awake, and has Laptop Cam open.</small>');
      return;
    }
    if (cam.id !== camId) { camId = cam.id; tries = 0; pill('Connecting', ''); say('Connecting to your laptop…', true); offer(); return; }
    const a = cam.p.a && cam.p.a[room.me];
    if (a && a.oid === oid && !answered && pc) {
      answered = true;
      const d = await unlock(a.s);
      if (d) try { await pc.setRemoteDescription(d); } catch (e) { console.warn(e); }
    }
    if (snap && cam.p.i && cam.p.i !== lastImg) {
      lastImg = cam.p.i;
      const im = await unlock(cam.p.i);
      if (im && snap) { still.src = im.d; still.style.display = 'block'; vid.style.display = 'none'; say(''); }
    }
  }

  async function start() {
    if (room || starting) return;
    starting = true;
    const g = ++gen;
    try { await join(g); } finally { starting = false; }
  }
  async function join(g) {
    try {
      const r = await joinRoom(onPeers, (on) => { if (!on) pill('No internet', ''); });
      if (g !== gen) return r.leave();
      room = r; await room.set({ r: 'view', w: watch, who: await lock({ n: name || '', d: device(), pid: store.get('lc_push_room') === ROOM ? store.get('lc_push_id') || '' : '' }) });
      // Nothing answers this password: either it's wrong or the laptop is off.
      if (!everSeen) setTimeout(async () => {
        if (everSeen || g !== gen) return;
        await stop(); dead = true;
        homeScreen('No camera found with that password. Check the password, and that the laptop is on with Laptop Cam open.');
      }, 7000);
    } catch { pill('No internet', ''); say('Can\'t reach the internet.<small>It will try again in a few seconds.</small>'); setTimeout(() => g === gen && start(), 5000); }
  }
  let starting = false;
  async function stop() {
    gen++; clearTimeout(timer); camId = ''; snap = false; tries = 0; pill('Paused', '');
    if (pc) { pc.close(); pc = null; }
    if (room) { const r = room; room = null; await r.leave(); }
  }
  // Stop watching when the phone screen is off or the app is in the background (saves data, camera light goes off).
  document.addEventListener('visibilitychange', () => { if (dead) return; if (document.visibilityState === 'hidden') stop(); else if (!room) { say('Connecting to your laptop…', true); start(); } });
  window.addEventListener('pagehide', stop);

  $('bSound').onclick = () => { vid.muted = !vid.muted; vid.play().catch(() => {}); $('bSound').textContent = vid.muted ? '🔇 Sound off' : '🔊 Sound on'; };
  $('bFull').onclick = () => { const el = $('viewer'); if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen && el.requestFullscreen().then(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch(() => {}); };
  $('bMore').onclick = async () => {
    await stop(); location.reload();
  };
  if (LOCAL) window.__lc.stills = () => { tries = 1; retry(); };   // local test: jump to still pictures
  start();
}

window.__lc = { store };
boot();
if ('serviceWorker' in navigator && !FAKE) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
